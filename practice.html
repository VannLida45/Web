<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <main>
        <form action="#">
            <fieldset>
                <legend>User Info</legend>
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your name" required>

                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="text" id="email" placeholder="Please enter your email" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="text" id="password" placeholder="Enter differrent character" maxlength="8" required>
                </div>
                <div>
                    <label for="major">Choose your major</label>
                    <label for="it">IT</label>
                    <input type="radio" id="it" name="major" value="IT">
                    <label for="design">Design</label>
                    <input type="radio" name="major" id="design" value="Design">
                    <label for="engineer">Engineering</label>
                    <input type="radio" name="major" id="engineer">
                </div>
                <div>
                    <p>Select where u live</p>
                    <label for="city">City</label>
                    <input type="checkbox" id="city">
                    <label for="province">Province</label>
                    <input type="checkbox" id="province">

                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
